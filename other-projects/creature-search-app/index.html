<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Creature Search App">
    <title>Creature Search App</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <main>
      <h1>Creature Search App</h1>
      <input id="search-input" required placeholder="Please enter the creature name or ID">
      <button id="search-button">Search</button>

      <div id="information">
        <h3 id="creature-information-title">Creature Information</h3>
        <!-- empty table that gets filled out by creature details -->
        <table id="stats-table">
          <tr>
            <th>Base</th>
            <th>Stats</th>
          </tr>
           <tr>
            <td>Name</td>
            <td id="creature-name"></td>
          </tr>
           <tr>
            <td>ID</td>
            <td id="creature-id"></td>
          </tr>
           <tr>
            <td>Weight</td>
            <td id="weight"></td>
          </tr>
           <tr>
            <td>Height</td>
            <td id="height"></td>
          </tr>
           <tr>
            <td>Types</td>
            <td id="types"></td>
          </tr>
           <tr>
            <td>HP</td>
            <td id="hp"></td>
          </tr>
           <tr>
            <td>Attack</td>
            <td id="attack"></td>
          </tr>
           <tr>
            <td>Defense</td>
            <td id="defense"></td>
          </tr>
          <tr>
            <td>Special Attack</td>
            <td id="special-attack"></td>
          </tr>
           <tr>
            <td>Special Defense</td>
            <td id="special-defense"></td>
          </tr>
          <tr>
            <td>Speed</td>
            <td id="speed"></td>
          </tr>
        </table>
      </div>
      <!-- link to the .js document -->
    </main>
    <script src="./script.js"></script>
  </body>
</html>
